name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install mypy
        run: python -m pip install mypy==1.18.2
      - name: Check Python types
        run: python tools/mypy-onnx.py

  clang-format:
    name: Clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install clang-format
        run: python -m pip install clang-format==18.1.8
      - name: Check changed C++ files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          # Enforce formatting incrementally until the existing C++ baseline is clean.
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(
              git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- \
                '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp'
            )

          if ((${#files[@]} == 0)); then
            echo "No changed C++ files to check."
            exit 0
          fi

          clang-format --dry-run --Werror "${files[@]}"
