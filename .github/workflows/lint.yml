name: Lint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          frozen: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Check Python style
        run: pixi run lint

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          frozen: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Check Python types
        run: pixi run typecheck

  clang-format:
    name: Clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          frozen: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Check changed C++ files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          # Enforce formatting incrementally until the existing C++ baseline is clean.
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(
              git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- \
                '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp'
            )

          if ((${#files[@]} == 0)); then
            echo "No changed C++ files to check."
            exit 0
          fi

          pixi run clang-format-check "${files[@]}"
